<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BROLI — Crusher</title>
<meta property="og:title" content="How high can you get your power level?">
<meta property="og:image" content="broli.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#EDF3E5;--tray:#fff;--stem:#16321B;--floret:#4E9A3A;--sticker:#FF3B1F;--line:#16321B}
body.legendary{--paper:#050D07;--tray:#0C1A0E;--stem:#E9FFD8;--floret:#A8FF3E;--sticker:#FFE24A;--line:#2C5B2E}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--paper);color:var(--stem);font-family:'Inter Tight',system-ui,sans-serif;
  transition:background .6s,color .6s;touch-action:manipulation;user-select:none}
#stage{position:relative;width:100%;height:100dvh;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}

.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
  align-items:flex-start;padding:14px 16px;pointer-events:none;z-index:5}
.hud .k{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--floret)}
.hud .v{font-family:'Space Mono',monospace;font-weight:700;font-size:26px;line-height:1}
.strikes{display:flex;gap:5px;margin-top:5px;justify-content:flex-end}
.strikes i{width:13px;height:13px;border:2px solid var(--line);display:block}
.strikes i.on{background:var(--sticker);border-color:var(--sticker)}
#combo{position:absolute;top:78px;left:0;right:0;text-align:center;pointer-events:none;z-index:5;
  font-family:'Anton',sans-serif;font-size:30px;text-transform:uppercase;color:var(--sticker);
  opacity:0;transition:opacity .2s}

.panel{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:26px 22px;
  background:var(--paper);transition:background .6s}
.panel.hide{display:none}
h1{font-family:'Anton',sans-serif;font-size:clamp(38px,12vw,68px);text-transform:uppercase;
  line-height:.88;margin-bottom:12px}
.lead{font-size:15.5px;max-width:30ch;opacity:.8;margin-bottom:22px;line-height:1.45}
.lead b{display:block;margin-top:9px;opacity:1}
button,.btn{font-family:'Anton',sans-serif;font-size:24px;text-transform:uppercase;letter-spacing:.03em;
  background:var(--sticker);color:#fff;border:0;padding:17px 40px;cursor:pointer;
  box-shadow:5px 5px 0 var(--line);text-decoration:none;display:inline-block}
body.legendary button,body.legendary .btn{color:#14260E}
button:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--line)}
button.ghost{background:none;color:var(--stem);border:2px solid var(--line);box-shadow:none;
  font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.12em;padding:12px 20px}
.final{font-family:'Space Mono',monospace;font-weight:700;font-size:clamp(42px,15vw,80px);line-height:1;margin:6px 0}
.rank{font-family:'Anton',sans-serif;font-size:26px;text-transform:uppercase;color:var(--sticker);margin-bottom:16px}
input{font-family:'Space Mono',monospace;font-size:15px;padding:13px;border:2px solid var(--line);
  background:var(--tray);color:var(--stem);width:210px;text-align:center;margin-bottom:12px}
.board{width:100%;max-width:340px;max-height:44dvh;overflow-y:auto;border:2px solid var(--line);
  background:var(--tray);margin-top:16px;text-align:left}
.board .row{display:flex;gap:10px;padding:9px 13px;border-bottom:1px solid #d8e2cd;
  font-family:'Space Mono',monospace;font-size:13px}
.board .row:last-child{border-bottom:0}
.board .row.me{background:var(--floret);color:#fff}
.board .n{width:26px;opacity:.6}
.board .who{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-title{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--floret);margin-top:20px}
.back{margin-top:20px;font-size:12px;opacity:.6}
.back a{color:inherit}
.acts{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:14px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div class="hud">
    <div><div class="k">Power level</div><div class="v" id="power">0</div></div>
    <div style="text-align:right"><div class="k">Strikes</div>
      <div class="strikes"><i id="s0"></i><i id="s1"></i><i id="s2"></i></div></div>
  </div>
  <div id="combo"></div>

  <!-- START -->
  <div class="panel" id="p-start">
    <h1>Crusher</h1>
    <div style="display:flex;gap:22px;margin-bottom:20px;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.06em">
      <div><div style="width:54px;height:54px;border:3px solid var(--floret);border-radius:50%;margin:0 auto 8px"></div>
        GREEN<br><b style="font-size:14px">TAP</b></div>
      <div><div style="width:54px;height:54px;border:3px solid var(--sticker);border-radius:50%;margin:0 auto 8px"></div>
        PURPLE<br><b style="font-size:14px">SWIPE</b></div>
    </div>
    <p class="lead">Punch the green ones. Swipe anywhere to dodge the rotten purple ones.
      <b>Anything that reaches you is a strike. Three and you're done.</b>
      <span style="display:block;margin-top:9px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;opacity:.65">
        On a computer: click to punch, SPACE to dodge</span></p>
    <button id="go">Start</button>
    <div class="acts">
      <button class="ghost" id="see">Leaderboard</button>
      <a class="btn ghost" href="index.html" style="box-shadow:none">Back</a>
    </div>
  </div>

  <!-- OVER -->
  <div class="panel hide" id="p-over">
    <div class="k" style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--floret)">Final power level</div>
    <div class="final" id="final">0</div>
    <div class="rank" id="rank"></div>
    <input id="name" placeholder="your name" maxlength="16" autocomplete="off">
    <button id="submit">Submit</button>
    <div class="acts"><button class="ghost" id="again">Again</button></div>
    <div class="board" id="board"></div>
    <p class="back"><a href="index.html">← $BROLI</a></p>
  </div>

  <!-- BOARD ONLY -->
  <div class="panel hide" id="p-board">
    <h1 style="font-size:clamp(30px,9vw,46px)">Top<br>Haters</h1>
    <div class="board" id="board2"></div>
    <div class="acts"><button class="ghost" id="closeB">Back</button></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $("cv"), cx = cv.getContext("2d");
let W = 0, H = 0, DPR = Math.min(devicePixelRatio || 1, 2);

function size(){
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", size);

const MAX = 9001;
let items = [], power = 0, strikes = 0, combo = 0, t = 0, spawnAt = 0, running = false, legend = false;
let shake = 0, flashes = [];

function reset(){
  items = []; power = 0; strikes = 0; combo = 0; t = 0; spawnAt = 0;
  legend = false; shake = 0; flashes = [];
  sparks = []; burst = 0; tier = 0;
  fists.L.p = 0; fists.R.p = 0;
  document.body.classList.remove("legendary");
  [0,1,2].forEach(i => $("s"+i).classList.remove("on"));
  $("power").textContent = "0";
}

function spawn(){
  const rotten = Math.random() < (0.16 + Math.min(0.14, t / 5200));
  items.push({
    x: 0.14 + Math.random() * 0.72,
    y: 0.16 + Math.random() * 0.62,
    z: 0,
    speed: 0.0125 + Math.random() * 0.0035 + Math.min(0.0080, t / 78000),
    rotten, dead: false, spin: (Math.random() - .5) * 2
  });
}

/* draw a broccoli: florets + stalk */
function broccoli(x, y, r, rotten){
  const dark = rotten ? "#4A2A63" : "#2F6B22";
  const mid  = rotten ? "#6B3E8C" : "#4E9A3A";
  const lite = rotten ? "#9A6BB8" : "#7FC24B";
  cx.strokeStyle = "#12240F"; cx.lineWidth = Math.max(1.5, r * .07);
  // stalk
  cx.fillStyle = rotten ? "#7B6B4E" : "#B9D98F";
  cx.beginPath(); cx.roundRect(x - r*.22, y + r*.15, r*.44, r*.78, r*.16); cx.fill(); cx.stroke();
  // florets
  const buds = [[0,-.42,.52],[-.5,-.16,.42],[.5,-.16,.42],[-.28,.16,.36],[.28,.16,.36]];
  buds.forEach(([bx,by,br],i) => {
    cx.fillStyle = i % 2 ? mid : dark;
    cx.beginPath(); cx.arc(x + bx*r, y + by*r, br*r, 0, 7); cx.fill(); cx.stroke();
  });
  cx.fillStyle = lite;
  cx.beginPath(); cx.arc(x - r*.16, y - r*.46, r*.19, 0, 7); cx.fill();
  if (rotten){ // drip
    cx.fillStyle = "#B98CD6";
    cx.beginPath(); cx.arc(x + r*.34, y + r*.5, r*.13, 0, 7); cx.fill(); cx.stroke();
  }
}

function loop(){
  if (!running) return;
  t += 16;
  const css = getComputedStyle(document.body);
  const bg = css.getPropertyValue("--paper").trim();

  cx.save();
  if (shake > 0){ cx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake); shake *= .84; }
  cx.fillStyle = bg; cx.fillRect(-40, -40, W + 80, H + 80);

  // horizon
  cx.strokeStyle = css.getPropertyValue("--line").trim(); cx.globalAlpha = .13; cx.lineWidth = 1;
  for (let i = 1; i < 7; i++){
    cx.beginPath(); cx.moveTo(0, H * i / 7); cx.lineTo(W, H * i / 7); cx.stroke();
  }
  cx.globalAlpha = 1;

  if (t > spawnAt){ spawn(); spawnAt = t + Math.max(300, 950 - t / 70); }

  items.sort((a,b) => a.z - b.z);
  items.forEach(o => {
    if (o.dead) return;
    o.z += o.speed;
    if (o.z >= 1){
      o.dead = true;
      miss(o.rotten ? "HIT" : "MISS");   // either type getting through costs you
      return;
    }
    const scale = 0.10 + Math.pow(o.z, 1.55) * 1.25;
    const px = W/2 + (o.x - .5) * W * (0.42 + o.z * 1.25);
    const py = H/2 + (o.y - .5) * H * (0.42 + o.z * 1.25);
    o.px = px; o.py = py; o.r = scale * Math.min(W, H) * .40;

    // ring shows it's in range to act on
    if (o.z > 0.30){
      cx.strokeStyle = o.rotten ? css.getPropertyValue("--sticker").trim()
                                : css.getPropertyValue("--floret").trim();
      cx.globalAlpha = Math.min(1, (o.z - 0.30) * 3) * 0.8;
      cx.lineWidth = 3; cx.setLineDash([7, 6]);
      cx.beginPath(); cx.arc(px, py, o.r * 1.45, 0, 7); cx.stroke();
      cx.setLineDash([]); cx.globalAlpha = 1;
    }

    cx.save(); cx.translate(px, py); cx.rotate(o.spin * o.z); cx.translate(-px, -py);
    broccoli(px, py, o.r, o.rotten);
    cx.restore();
  });
  items = items.filter(o => !o.dead || o.fx);

  flashes = flashes.filter(f => {
    f.life -= .04;
    if (f.life <= 0) return false;
    cx.globalAlpha = Math.min(1, f.life);
    cx.fillStyle = f.bad ? css.getPropertyValue("--sticker").trim() : css.getPropertyValue("--floret").trim();
    cx.font = (f.life > 1 ? "700 34px 'Space Mono', monospace" : "700 20px 'Space Mono', monospace");
    cx.textAlign = "center";
    cx.fillText(f.txt, f.x, f.y - (1.4 - f.life) * 34);
    cx.globalAlpha = 1;
    return true;
  });

  const lvl = level();
  drawEnergy(lvl);
  drawFist(fists.L, lvl);
  drawFist(fists.R, lvl);
  drawBurst();

  cx.restore();
  requestAnimationFrame(loop);
}

function hitTest(cxp, cyp){
  let best = null;
  items.forEach(o => {
    if (o.dead || o.z < 0.06) return;
    const d = Math.hypot(o.px - cxp, o.py - cyp);
    const reach = Math.max(o.r * 1.25, 26);   // fingers are bigger than distant broccoli
    if (d < reach && (!best || o.z > best.z)) best = o;
  });
  return best;
}

function add(n, x, y, bad){
  power = Math.max(0, Math.min(MAX, power + n));
  $("power").textContent = power >= MAX ? "OVER 9000" : power.toLocaleString();
  flashes.push({ txt: (n > 0 ? "+" : "") + n, x, y, life: 1, bad });
  checkTier();
}

/* ── his hands ── */
const fists = { L:{ rx:0.19, p:0, tx:0, ty:0 }, R:{ rx:0.81, p:0, tx:0, ty:0 } };
function punchAt(x, y){
  const f = x < W/2 ? fists.L : fists.R;
  f.p = 1; f.tx = x; f.ty = y;
}
function drawFist(f, lvl){
  const homeX = f.rx * W, homeY = H * 1.16;
  const e = f.p > 0 ? Math.sin(f.p * Math.PI) : 0;      // out and back
  const x = homeX + (f.tx - homeX) * e;
  const y = homeY + (f.ty - homeY) * e;
  const r = Math.min(W, H) * 0.155 * (1 - e * 0.42);
  const skin = lvl > .66 ? "#A8FF3E" : lvl > .33 ? "#7FC24B" : "#5FA83C";

  cx.save();
  cx.strokeStyle = "#12240F"; cx.lineWidth = Math.max(2, r * .09);
  if (lvl > 0){ cx.shadowColor = "rgba(150,255,70," + (lvl * .9) + ")"; cx.shadowBlur = 26 * lvl; }

  // forearm
  cx.fillStyle = skin;
  cx.beginPath();
  cx.moveTo(x - r*.62, y + r*.2); cx.lineTo(homeX - r*.78, H + 60);
  cx.lineTo(homeX + r*.78, H + 60); cx.lineTo(x + r*.62, y + r*.2);
  cx.closePath(); cx.fill(); cx.stroke();

  // wristband
  cx.fillStyle = "#3E7F7A";
  cx.beginPath(); cx.roundRect(x - r*.72, y + r*.18, r*1.44, r*.42, r*.12);
  cx.fill(); cx.stroke();

  // fist
  cx.fillStyle = skin;
  cx.beginPath(); cx.roundRect(x - r*.78, y - r*.72, r*1.56, r*1.1, r*.34);
  cx.fill(); cx.stroke();
  cx.shadowBlur = 0;
  cx.lineWidth = Math.max(1.2, r * .05);
  for (let i = 0; i < 3; i++){
    const kx = x - r*.42 + i * r*.42;
    cx.beginPath(); cx.moveTo(kx, y - r*.62); cx.lineTo(kx, y - r*.05); cx.stroke();
  }
  cx.restore();
  f.p = Math.max(0, f.p - 0.11);
}

/* ── power-up escalation ── */
let sparks = [], burst = 0, tier = 0;
function level(){ return Math.min(1, power / MAX); }

function checkTier(){
  const now = power >= MAX ? 3 : power >= 6000 ? 2 : power >= 3000 ? 1 : 0;
  if (now > tier){
    tier = now; burst = 1; shake = 20;
    flashes.push({ txt: ["", "POWER RISING", "SURGING", "LEGENDARY"][now], x: W/2, y: H*0.42, life: 1.4, bad: false });
    if (now === 3) document.body.classList.add("legendary");
  }
}

function drawEnergy(lvl){
  if (lvl <= 0) return;
  // aura closing in from the edges
  const g = cx.createRadialGradient(W/2, H*0.62, Math.min(W,H)*0.16, W/2, H*0.62, Math.max(W,H)*0.8);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, `rgba(140,255,60,${0.06 + lvl * 0.42})`);
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);

  // rising embers
  if (Math.random() < lvl * 0.9)
    sparks.push({ x: Math.random()*W, y: H + 10, v: 2 + Math.random()*4 + lvl*7, s: 2 + Math.random()*3, life: 1 });
  sparks = sparks.filter(p => {
    p.y -= p.v; p.life -= 0.014;
    if (p.life <= 0 || p.y < -20) return false;
    cx.globalAlpha = p.life * (0.35 + lvl * 0.65);
    cx.fillStyle = lvl > .66 ? "#DDFF8C" : "#A8FF3E";
    cx.fillRect(p.x, p.y, p.s, p.s * 3);
    cx.globalAlpha = 1;
    return true;
  });

  // upward streak lines at high power
  if (lvl > 0.5){
    cx.strokeStyle = "#A8FF3E"; cx.globalAlpha = (lvl - 0.5) * 0.5; cx.lineWidth = 2;
    for (let i = 0; i < 9; i++){
      const sx = (i / 9) * W + ((t * 0.4 + i * 90) % 60);
      cx.beginPath(); cx.moveTo(sx, H); cx.lineTo(sx - 14, H * 0.45); cx.stroke();
    }
    cx.globalAlpha = 1;
  }
}

function drawBurst(){
  if (burst <= 0) return;
  const r = (1 - burst) * Math.max(W, H) * 0.9;
  cx.strokeStyle = "#FFFFFF"; cx.globalAlpha = burst * 0.9; cx.lineWidth = 10 * burst;
  cx.beginPath(); cx.arc(W/2, H*0.55, r, 0, 7); cx.stroke();
  cx.fillStyle = `rgba(255,255,255,${burst * 0.35})`; cx.fillRect(0, 0, W, H);
  cx.globalAlpha = 1;
  burst = Math.max(0, burst - 0.055);
}

function miss(label){
  strikes++;
  $("s" + (strikes - 1))?.classList.add("on");
  combo = 0; $("combo").style.opacity = 0;
  shake = 12;
  flashes.push({ txt: label || "MISS", x: W/2, y: H*0.62, life: 1, bad: true });
  if (strikes >= 3) over();
}

function tap(x, y){
  if (!running) return;
  punchAt(x, y);
  const o = hitTest(x, y);
  if (!o) return;
  if (o.rotten) return;              // punching rotten does nothing now — you dodge those
  o.dead = true;
  combo++; hits++;
  const gain = 120 + combo * 25;
  add(gain, o.px, o.py, false);
  shake = 4;
  if (combo > 2){
    $("combo").textContent = combo + "x";
    $("combo").style.opacity = 1;
    clearTimeout(window._c);
    window._c = setTimeout(() => $("combo").style.opacity = 0, 700);
  }
}

let dodgeReady = 0;
function dodge(){
  if (!running || t < dodgeReady) return;
  dodgeReady = t + 420;                            // no spamming it
  const near = items.filter(o => !o.dead && o.rotten && o.z > 0.30);
  if (!near.length){
    flashes.push({ txt: "whiff", x: W/2, y: H*0.7, life: .7, bad: true });
    return;
  }
  near.forEach(o => { o.dead = true; hits++; combo++; punchAt(o.px, o.py); add(150 + combo * 20, o.px, o.py, false); });
  shake = 9;
  flashes.push({ txt: "DODGED", x: W/2, y: H*0.58, life: 1, bad: false });
}

/* tap vs swipe decided on release */
let dx0 = 0, dy0 = 0;
cv.addEventListener("pointerdown", e => {
  const r = cv.getBoundingClientRect();
  dx0 = e.clientX - r.left; dy0 = e.clientY - r.top;
});
cv.addEventListener("pointerup", e => {
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  if (Math.hypot(x - dx0, y - dy0) > 26) dodge();
  else tap(dx0, dy0);
});
cv.addEventListener("pointercancel", () => {});

/* desktop: space or arrows to dodge, since you can't swipe with a mouse */
addEventListener("keydown", e => {
  if ([" ", "Spacebar", "ArrowLeft", "ArrowRight", "ArrowDown", "s", "S"].includes(e.key)){
    e.preventDefault();
    if (running) dodge();
    else if (!$("p-start").classList.contains("hide")) start();
  }
});

/* ── flow ── */
let token = null, hits = 0, startedAt = 0;

async function start(){
  reset(); size();
  hits = 0; startedAt = Date.now(); token = null;
  fetch("/api/score", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ start: true })
  }).then(r => r.json()).then(d => token = d.token).catch(()=>{});
  $("p-start").classList.add("hide");
  $("p-over").classList.add("hide");
  $("p-board").classList.add("hide");
  running = true;
  requestAnimationFrame(loop);
}
function over(){
  running = false;
  $("final").textContent = power >= MAX ? "OVER 9000" : power.toLocaleString();
  $("rank").textContent =
    power >= MAX ? "Legendary" :
    power >= 6000 ? "Crusher" :
    power >= 3000 ? "Hater" :
    power >= 1000 ? "Civilian" : "Traitor";
  $("p-over").classList.remove("hide");
  load("board");
}

$("go").onclick = start;
$("again").onclick = start;
$("see").onclick = () => { $("p-board").classList.remove("hide"); load("board2"); };
$("closeB").onclick = () => $("p-board").classList.add("hide");

/* ── leaderboard ── */
let myName = "";
function draw(el, rows){
  if (!rows || !rows.length){ $(el).innerHTML = `<div class="row"><span class="who">No scores yet. Be first.</span></div>`; return; }
  $(el).innerHTML = rows.map((r,i) =>
    `<div class="row${r.name === myName && r.score === lastScore ? " me" : ""}">
       <span class="n">${i+1}</span>
       <span class="who">${r.name}</span>
       <span>${r.score >= MAX ? "9001" : r.score.toLocaleString()}</span>
     </div>`).join("");
}
let lastScore = -1;
async function load(el){
  $(el).innerHTML = `<div class="row"><span class="who">Loading…</span></div>`;
  try {
    const r = await fetch("/api/score");
    draw(el, (await r.json()).scores);
  } catch { draw(el, null); }
}
$("submit").onclick = async e => {
  const n = $("name").value.trim();
  if (!n) return $("name").focus();
  if (!token){ e.target.textContent = "No session — replay"; return; }
  myName = n.slice(0,16); lastScore = power;
  e.target.disabled = true; e.target.textContent = "Sending";
  try {
    const r = await fetch("/api/score", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, name: myName, score: power, hits, ms: Date.now() - startedAt })
    });
    const d = await r.json();
    if (d.error){ e.target.textContent = d.error; return; }
    draw("board", d.scores);
    e.target.textContent = "Submitted";
    token = null;
  } catch { e.target.textContent = "Failed — retry"; e.target.disabled = false; }
};

size();
</script>
</body>
